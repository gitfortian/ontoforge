server:
  address: ${S0_HOST:127.0.0.1}
  port: ${PORT:8080}
spring:
  application:
    name: ontoforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ontology}
    username: ${DB_USERNAME:ontology}
    password: ${DB_PASSWORD:ontology_dev_only}
  flyway:
    enabled: true
    validate-on-migrate: true
