server:
  address: ${S0_HOST:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ONTOFORGE_SESSION
        path: /api
        http-only: true
        same-site: lax
        secure: ${ONTOFORGE_SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: ontoforge
  http:
    converters:
      # Existing controllers and persisted JSON use Jackson 2 JsonNode.
      preferred-json-mapper: jackson2
  datasource:
    # Windows native PostgreSQL is the default local development target.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ontoforge}
    username: ${DB_USERNAME:postgres}
    # Never commit a developer's local PostgreSQL password.
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    validate-on-migrate: true

ontoforge:
  agent:
    enabled: ${ONTOFORGE_AGENT_ENABLED:false}
    base-url: ${ONTOFORGE_AGENT_BASE_URL:}
    api-key: ${ONTOFORGE_AGENT_API_KEY:}
    model: ${ONTOFORGE_AGENT_MODEL:}
    allowed-packages: ${ONTOFORGE_AGENT_ALLOWED_PACKAGES:}
  binding:
    source:
      # URL and credentials are intentionally not defaulted: M5 fails closed until a dedicated reader is provisioned.
      allowed-tables: ${ONTOFORGE_BINDING_SOURCE_ALLOWED_TABLES:m5_supplier_source}
  security:
    authentication-mode: ${ONTOFORGE_SECURITY_AUTHENTICATION_MODE:local-session}
    bootstrap:
      enabled: ${ONTOFORGE_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${ONTOFORGE_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${ONTOFORGE_BOOTSTRAP_ADMIN_PASSWORD:}
    oidc:
      # Production must provide all three values. Missing values fail application startup.
      issuer: ${OIDC_ISSUER_URI:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      audience: ${OIDC_AUDIENCE:}
