# No fallback to DB_*: Maven tests must never inherit the development database.
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

# Stable test-only HMAC key for restart-detectable M7 cursors; never used by production.
ontoforge:
  security:
    authentication-mode: oidc-jwt
  objectset:
    cursor-signing-secret: ${ONTOFORGE_OBJECTSET_CURSOR_SIGNING_SECRET:ontoforge-test-only-cursor-signing-secret-2026}
