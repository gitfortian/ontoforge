name: M6 Object Runtime Prototype Browser Review

# Static UX evidence only. This workflow is not a production Runtime gate.
on:
  pull_request:
    paths:
      - 'doc/prototypes/m6-object-runtime-lowfi.html'
      - 'doc/prototypes/m6-object-runtime-highfi.html'
      - 'doc/prototypes/tests/test_m6_object_runtime_lowfi_browser.py'
      - 'doc/prototypes/tests/test_m6_object_runtime_highfi_browser.py'
      - 'doc/implementation/M6-ObjectRuntime-UX-Low评审说明.md'
      - 'doc/implementation/M6-ObjectRuntime-UX-High评审说明.md'
      - 'doc/proposals/OFIP-0008-M6-通用ObjectRuntime.md'
      - '.github/workflows/m6-object-runtime-lowfi-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-prototype-chromium:
    name: M6 UX-Low + UX-High Real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install playwright==1.57.0
      - name: Install actual Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify UX-Low and UX-High interaction contracts
        env:
          UX_CAPTURE_SCREENSHOTS: '1'
          UX_SCREENSHOT_DIR: '${{ runner.temp }}/m6-object-runtime-prototype-shots'
        run: python -m unittest doc.prototypes.tests.test_m6_object_runtime_lowfi_browser doc.prototypes.tests.test_m6_object_runtime_highfi_browser -v
      - name: Upload prototype screenshots on success and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m6-object-runtime-prototype-chromium
          path: '${{ runner.temp }}/m6-object-runtime-prototype-shots'
          if-no-files-found: warn
          retention-days: 14
