name: OntoForge S0 MVP foundation
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "ontoforge-boot/**"
      - "ontoforge-ui/**"
      - "pom.xml"
      - "compose.yaml"
      - "scripts/verify-s0.ps1"
      - "README.md"
      - "doc/implementation/S0-MVP-迭代计划.md"
      - "doc/implementation/S0-Windows11-本机PostgreSQL-启动与验收.md"
      - ".github/workflows/s0-mvp.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: ontology_dev_only
          POSTGRES_DB: ontoforge_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontology -d ontoforge_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # CI uses an isolated service DB, never developer machine credentials.
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ontoforge_test_ci
      TEST_DB_USERNAME: ontology
      TEST_DB_PASSWORD: ontology_dev_only
      TEST_DB_ALLOW_FAULT_INJECTION: 'true'
      S0_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            ontoforge-boot/pom.xml
      - name: Verify OntoForge canonical project naming
        run: |
          test ! -d apps
          test ! -d infra
          test -f pom.xml
          test -f ontoforge-boot/pom.xml
          test -f ontoforge-ui/package.json
          grep -q '<module>ontoforge-boot</module>' pom.xml
          grep -q '<groupId>io.ontoforge</groupId>' pom.xml
          grep -q '<artifactId>ontoforge</artifactId>' pom.xml
          grep -q '"name": "ontoforge-ui"' ontoforge-ui/package.json
          test ! -d ontology-system-boot
          test ! -d ontology-system-ui
          test -f ontoforge-boot/src/main/java/io/ontoforge/boot/OntoForgeApplication.java
      - name: Assert DB password cannot fall back to a committed default
        run: |
          grep -Fq 'password: ${DB_PASSWORD}' ontoforge-boot/src/main/resources/application.yml
          test -f scripts/verify-s0.ps1
      - name: Real PostgreSQL startup and Flyway integration tests
        run: mvn -B -pl ontoforge-boot -am verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned UI dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ontoforge-ui
      - name: Type-check and production build
        run: npm run build
        working-directory: ontoforge-ui
