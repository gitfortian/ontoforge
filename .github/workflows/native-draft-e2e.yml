name: OntoForge Native Model Real Browser E2E

# REAL PostgreSQL 17 + Spring Boot + Vite + Chromium; not a mock-page test.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-parser:
    name: Windows PowerShell 5.1 Acceptance Script Syntax
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Parse the acceptance scripts using native Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('scripts/run-local.ps1', 'scripts/local-environment.ps1', 'scripts/tests/Test-LocalStartup.ps1', 'scripts/verify-s0.ps1', 'scripts/verify-objecttype.ps1', 'scripts/verify-snapshot.ps1', 'scripts/verify-linktype.ps1', 'scripts/configure-main-protection.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              throw "$script failed Windows PowerShell 5.1 parse: $($parseErrors | Out-String)"
            }
            Write-Host "[PASS] Windows PowerShell parser: $script"
          }
          Write-Host 'Syntax only: this job does NOT claim an actual Windows PostgreSQL runtime test.'
      - name: Check local startup credentials using Java properties and Windows ACLs
        shell: powershell
        run: ./scripts/tests/Test-LocalStartup.ps1
  objecttype-browser:
    name: Real PG17 + API + React Chromium Golden Story
    runs-on: ubuntu-latest
    timeout-minutes: 32
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ontoforge_test_e2e
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: ontology_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontology -d ontoforge_test_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/ontoforge_test_e2e
      DB_USERNAME: ontology
      DB_PASSWORD: ontology_dev_only
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ontoforge_test_e2e
      TEST_DB_USERNAME: ontology
      TEST_DB_PASSWORD: ontology_dev_only
      ONTOFORGE_SECURITY_AUTHENTICATION_MODE: oidc-jwt
      E2E_AUTH_FILE: /tmp/ontoforge-b0-private-fixture.json
      E2E_M5_BINDING_EVIDENCE: /tmp/ontoforge-m5-binding-acceptance.json
      E2E_M7_CURSOR_EVIDENCE: /tmp/ontoforge-m7-cursor-acceptance.json
      E2E_M8_CURSOR_EVIDENCE: /tmp/ontoforge-m8-cursor-acceptance.json
      E2E_M8_LINK_RECEIPT_EVIDENCE: /tmp/ontoforge-m8-write-receipt-acceptance.json
      ONTOFORGE_OBJECTSET_CURSOR_SIGNING_SECRET: ontoforge-e2e-stable-cursor-signing-secret-2026
      S0_HOST: 127.0.0.1
      ONTOFORGE_BINDING_SOURCE_URL: jdbc:postgresql://127.0.0.1:5432/ontoforge_test_e2e
      ONTOFORGE_BINDING_SOURCE_USERNAME: ontoforge_binding_login
      ONTOFORGE_BINDING_SOURCE_PASSWORD: m5_test_reader_only
      ONTOFORGE_BINDING_SOURCE_ALLOWED_TABLES: m5_supplier_source,m8_factory_cells,m8_quality_events
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify shared Java/ECMAScript RFC 8785 golden vectors
        run: node scripts/ci/check_jcs_vectors.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile actual application and isolated test-classpath IdP
        run: |
          mvn -B -pl ontoforge-boot -am -DskipTests install
          mvn -B -pl ontoforge-boot dependency:build-classpath -Dmdep.outputFile=target/e2e-classpath
          nohup java -cp "ontoforge-boot/target/test-classes:$(cat ontoforge-boot/target/e2e-classpath)" io.ontoforge.boot.B0BrowserFixture serve "$E2E_AUTH_FILE" > /tmp/ontoforge-idp.log 2>&1 &
          echo $! > /tmp/ontoforge-idp.pid
          for i in $(seq 1 30); do
            if test -s "$E2E_AUTH_FILE"; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          fixture=json.loads(Path(os.environ['E2E_AUTH_FILE']).read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for name, key in [('OIDC_ISSUER_URI','issuer'),('OIDC_JWK_SET_URI','jwkSetUri'),('OIDC_AUDIENCE','audience')]:
                  env.write(name+'='+fixture[key]+'\n')
          PY
      - name: Run actual Boot jar with production JWT decoder and public JWKS
        run: |
          nohup java -jar ontoforge-boot/target/ontoforge-boot-0.1.0-SNAPSHOT.jar > /tmp/ontoforge-api.log 2>&1 &
          echo $! > /tmp/ontoforge-api.pid
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:8080/api/system/status >/tmp/model-status.json; then break; fi
            sleep 2
          done
          cat /tmp/model-status.json || true
          curl -fsS http://127.0.0.1:8080/api/system/status
          java -cp "ontoforge-boot/target/test-classes:$(cat ontoforge-boot/target/e2e-classpath)" io.ontoforge.boot.B0BrowserFixture provision "$E2E_AUTH_FILE"
      - name: Exercise explicit B0 package grant and reject cross-workspace takeover in real PostgreSQL
        run: |
          pg_container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17/ {print $1; exit}')
          test -n "$pg_container" || { echo 'PostgreSQL service container not found'; exit 1; }
          # Genuine psql execution against the same real PG17 database used by product E2E.
          docker exec -i "$pg_container" psql -X -v ON_ERROR_STOP=1 -U ontology -d ontoforge_test_e2e \
            -v workspace_key=operator -v workspace_name='B0 operator test' \
            -v issuer=http://127.0.0.1:18765 -v subject=operator-test \
            -v display_name='Operator Test' -v role=EDITOR \
            -v package_id=manufacturing.operator-test < scripts/b0-provision.psql
          # Same identity/package grant must be repeatable without creating duplicates.
          docker exec -i "$pg_container" psql -X -v ON_ERROR_STOP=1 -U ontology -d ontoforge_test_e2e \
            -v workspace_key=operator -v workspace_name='B0 operator test' \
            -v issuer=http://127.0.0.1:18765 -v subject=operator-test \
            -v display_name='Operator Test' -v role=EDITOR \
            -v package_id=manufacturing.operator-test < scripts/b0-provision.psql
          # A different workspace must never silently claim an existing assigned package.
          if docker exec -i "$pg_container" psql -X -v ON_ERROR_STOP=1 -U ontology -d ontoforge_test_e2e \
            -v workspace_key=takeover -v workspace_name='Unauthorized takeover' \
            -v issuer=http://127.0.0.1:18765 -v subject=other-subject \
            -v display_name='Other Subject' -v role=OWNER \
            -v package_id=manufacturing.operator-test < scripts/b0-provision.psql; then
            echo 'SECURITY FAIL: cross-workspace package assignment unexpectedly succeeded'
            exit 1
          fi
          docker exec "$pg_container" psql -X -qAt -U ontology -d ontoforge_test_e2e \
            -c "SELECT count(*) FROM b0_package_assignment WHERE package_id='manufacturing.operator-test'" | grep -qx 1
          echo 'B0 provisioning repeat and cross-workspace conflict protections PASS'
      - name: Provision and prove the dedicated M5 read-only source role
        run: |
          pg_container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17/ {print $1; exit}')
          test -n "$pg_container" || { echo 'PostgreSQL service container not found'; exit 1; }
          docker exec -i -e PGPASSWORD=ontology_dev_only -e ONTOFORGE_BINDING_SOURCE_PASSWORD="$ONTOFORGE_BINDING_SOURCE_PASSWORD" "$pg_container" psql -X -v ON_ERROR_STOP=1 -U ontology -d ontoforge_test_e2e < scripts/provision-m5-source-reader.sql
          docker exec "$pg_container" psql -X -qAt -U ontology -d ontoforge_test_e2e -c "SELECT rolsuper FROM pg_roles WHERE rolname='ontoforge_binding_login'" | grep -qx f
          docker exec "$pg_container" psql -X -qAt -U ontology -d ontoforge_test_e2e -c "SELECT has_table_privilege('ontoforge_binding_login','public.m5_supplier_source','SELECT') AND NOT has_table_privilege('ontoforge_binding_login','public.m5_supplier_source','INSERT')" | grep -qx t
          echo 'M5 source role is non-superuser, SELECT-only on the allowlisted fixture'
      - name: Provision isolated M8 source/target fixtures for real Chromium only
        run: |
          pg_container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17/ {print $1; exit}')
          test -n "$pg_container" || exit 1
          docker exec -i "$pg_container" psql -X -v ON_ERROR_STOP=1 -U ontology -d ontoforge_test_e2e < scripts/m8-onehop-e2e-source.sql
          docker exec "$pg_container" psql -X -qAt -U ontology -d ontoforge_test_e2e -c "SELECT has_table_privilege('ontoforge_binding_login','public.m8_factory_cells','SELECT') AND has_table_privilege('ontoforge_binding_login','public.m8_quality_events','SELECT') AND NOT has_table_privilege('ontoforge_binding_login','public.m8_quality_events','INSERT')" | grep -qx t

      - name: Launch real Vite React application
        env:
          VITE_OIDC_CLIENT_ID: ontoforge-e2e
          VITE_OIDC_AUTHORIZATION_ENDPOINT: http://127.0.0.1:18765/authorize
          VITE_OIDC_TOKEN_ENDPOINT: http://127.0.0.1:18765/token
        working-directory: ontoforge-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev > /tmp/ontoforge-vite.log 2>&1 &
          echo $! > /tmp/ontoforge-vite.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
      - name: Seed alternate PostgreSQL demo test tables
        run: |
          pg_container=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17/ {print $1; exit}')
          test -n "$pg_container" || exit 1
          docker exec -i "$pg_container" psql -X -v ON_ERROR_STOP=1 -U ontology -d ontoforge_test_e2e < scripts/mvp-configurable-source-e2e.sql
      - name: Install real Playwright Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test real ObjectType and immutable Snapshot golden stories with failure recovery
        env:
          E2E_SHOTS: '${{ runner.temp }}/ontoforge-native-e2e-shots'
        run: python -m unittest discover -s ontoforge-ui/e2e -p 'test_*.py' -v
      - name: Verify M7 cursor rejects revoked B0 package authorization
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          from datetime import datetime
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          evidence = json.loads(Path(os.environ["E2E_M7_CURSOR_EVIDENCE"]).read_text(encoding="utf-8"))
          fixture = json.loads(Path(os.environ["E2E_AUTH_FILE"]).read_text(encoding="utf-8"))
          expires = datetime.fromisoformat(evidence["expiresAt"].replace("Z", "+00:00")).timestamp()
          assert expires > time.time() + 20, "M7 cursor expired before B0 revocation test; restart evidence would be ambiguous"
          containers = subprocess.check_output(["docker", "ps", "--format", "{{.ID}} {{.Image}}"], text=True).splitlines()
          pg_container = next((line.split()[0] for line in containers if len(line.split()) > 1 and line.split()[1].startswith("postgres:17")), None)
          assert pg_container, "PostgreSQL 17 test container not found"

          def psql(*args, input_sql=None):
              # psql does not interpolate variables in a -c command string.
              # Feed SQL through stdin (-f -) so :'name' literals are safely quoted.
              return subprocess.run(
                  ["docker", "exec", "-i", pg_container, "psql", "-X", "-qAt", "-v", "ON_ERROR_STOP=1",
                   "-U", "ontology", "-d", "ontoforge_test_e2e", *args],
                  input=input_sql, text=True, check=True, capture_output=True,
              ).stdout.strip()

          package_id = evidence["packageId"]
          workspace_id = psql("-v", "package_id=" + package_id, "-f", "-",
                              input_sql="SELECT workspace_id::text FROM b0_package_assignment WHERE package_id=:'package_id';")
          assert workspace_id, "Expected explicit B0 package grant was not found"
          psql("-v", "package_id=" + package_id, "-f", "-",
               input_sql="DELETE FROM b0_package_assignment WHERE package_id=:'package_id';")
          code = None
          status = None
          message = None
          try:
              request = Request(
                  "http://127.0.0.1:8080/api/runtime/object-sets/pages",
                  data=json.dumps({"cursor": evidence["cursor"]}).encode("utf-8"),
                  method="POST",
                  headers={"Authorization": "Bearer " + fixture["editorToken"], "Content-Type": "application/json"},
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      raise AssertionError("M7 page unexpectedly succeeded after B0 package grant revocation")
              except HTTPError as error:
                  status = error.code
                  payload = json.loads(error.read())
                  code = payload.get("code")
                  message = payload.get("message", "")
                  assert status == 403, f"Expected 403 after B0 grant revocation, got {status}: {payload}"
                  assert code == "FORBIDDEN", f"Expected FORBIDDEN after B0 grant revocation: {payload}"
                  assert "objects" not in payload and "aggregate" not in payload, "Denied page leaked partial results"
          finally:
              psql("-v", "package_id=" + package_id, "-v", "workspace_id=" + workspace_id, "-f", "-",
                   input_sql="INSERT INTO b0_package_assignment(workspace_id,package_id) VALUES (:'workspace_id'::uuid, :'package_id') ON CONFLICT (package_id) DO NOTHING;")

          # Restoring the grant must not resurrect a cursor whose revalidation failed.
          replay_status = None
          replay_code = None
          replay_request = Request(
              "http://127.0.0.1:8080/api/runtime/object-sets/pages",
              data=json.dumps({"cursor": evidence["cursor"]}).encode("utf-8"),
              method="POST",
              headers={"Authorization": "Bearer " + fixture["editorToken"], "Content-Type": "application/json"},
          )
          try:
              with urlopen(replay_request, timeout=15) as response:
                  raise AssertionError("M7 cursor unexpectedly revived after B0 package grant restoration")
          except HTTPError as error:
              replay_status = error.code
              replay_payload = json.loads(error.read())
              replay_code = replay_payload.get("code")
              assert replay_status == 410, f"Expected 410 after restoring grant for invalidated cursor, got {replay_status}: {replay_payload}"
              assert replay_code == "RESULT_EXPIRED", f"Expected RESULT_EXPIRED after grant restoration: {replay_payload}"
              assert "objects" not in replay_payload and "aggregate" not in replay_payload, "Expired cursor replay leaked results"

          Path("/tmp/ontoforge-m7-b0-revocation.json").write_text(json.dumps({
              "packageId": package_id, "bindingId": evidence["bindingId"], "status": status,
              "code": code, "message": message, "replayStatus": replay_status,
              "replayCode": replay_code, "result": "B0_GRANT_REVOKED_THEN_RESTORED_CURSOR_EXPIRED",
          }, indent=2), encoding="utf-8")
          print("M7 cursor rechecked B0 package authorization; revoked grant returns 403, restoring the grant does not revive the old cursor (410)")
          PY
      - name: Exercise isolated ObjectType, Snapshot and LinkType HTTP acceptance in real PostgreSQL
        shell: pwsh
        run: |
          $fixture = Get-Content -LiteralPath $env:E2E_AUTH_FILE -Raw | ConvertFrom-Json
          $env:ONTOFORGE_BEARER_TOKEN = $fixture.editorToken
          ./scripts/verify-objecttype.ps1 -Mode Exercise -AllowCreateTestDraft -PackageId $fixture.packages[61] -EvidencePath '${{ runner.temp }}/ontoforge-objecttype-acceptance.json'
          ./scripts/verify-snapshot.ps1 -Mode Exercise -AllowCreateTestDraft -PackageId $fixture.packages[62] -EvidencePath '${{ runner.temp }}/ontoforge-snapshot-acceptance.json'
          ./scripts/verify-linktype.ps1 -Mode Exercise -AllowCreateTestDraft -PackageId $fixture.packages[63] -EvidencePath '${{ runner.temp }}/ontoforge-linktype-acceptance.json'
      - name: Actually restart Spring Boot against the same PostgreSQL 17 database
        run: |
          oldpid="$(cat /tmp/ontoforge-api.pid)"
          kill "$oldpid"
          for i in $(seq 1 35); do
            if ! kill -0 "$oldpid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$oldpid" 2>/dev/null; then
            echo "Old service failed to terminate; cannot claim restart evidence"
            exit 1
          fi
          nohup java -jar ontoforge-boot/target/ontoforge-boot-0.1.0-SNAPSHOT.jar > /tmp/ontoforge-api-restarted.log 2>&1 &
          echo $! >/tmp/ontoforge-api-restarted.pid
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:8080/api/system/status >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/system/status
          echo "New backend PID $(cat /tmp/ontoforge-api-restarted.pid); PostgreSQL service preserved"
      - name: Verify M7 cursor expires after actual backend restart
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          evidence = json.loads(Path(os.environ["E2E_M7_CURSOR_EVIDENCE"]).read_text(encoding="utf-8"))
          fixture = json.loads(Path(os.environ["E2E_AUTH_FILE"]).read_text(encoding="utf-8"))
          expires = datetime.fromisoformat(evidence["expiresAt"].replace("Z", "+00:00")).timestamp()
          assert expires > time.time(), "M7 cursor TTL elapsed; cannot attribute 410 specifically to restart"
          request = Request(
              "http://127.0.0.1:8080/api/runtime/object-sets/pages",
              data=json.dumps({"cursor": evidence["cursor"]}).encode("utf-8"),
              method="POST",
              headers={"Authorization": "Bearer " + fixture["editorToken"], "Content-Type": "application/json"},
          )
          try:
              with urlopen(request, timeout=15) as response:
                  raise AssertionError("M7 cursor unexpectedly survived actual Spring Boot process restart")
          except HTTPError as error:
              payload = json.loads(error.read())
              assert error.code == 410, f"Expected 410 after backend restart, got {error.code}: {payload}"
              assert payload.get("code") == "RESULT_EXPIRED", f"Unexpected restart cursor response: {payload}"
              assert "服务重启后失效" in payload.get("message", ""), f"Response did not identify volatile snapshot loss: {payload}"
              assert "objects" not in payload and "aggregate" not in payload, "Restarted service leaked partial results"

          repeat_request = Request(
              "http://127.0.0.1:8080/api/runtime/object-sets/query",
              data=json.dumps(evidence["query"]).encode("utf-8"),
              method="POST",
              headers={"Authorization": "Bearer " + fixture["editorToken"], "Content-Type": "application/json"},
          )
          with urlopen(repeat_request, timeout=15) as response:
              repeated_query = json.loads(response.read())
          assert repeated_query.get("status") == "SUCCESS", f"Same query failed after process restart: {repeated_query}"
          assert repeated_query.get("queryDigest") == evidence["queryDigest"], (
              f"Canonical query digest changed across JVM restart: before={evidence['queryDigest']}, "
              f"after={repeated_query.get('queryDigest')}"
          )
          Path("/tmp/ontoforge-m7-cursor-restart-result.json").write_text(json.dumps({
              "packageId": evidence["packageId"], "bindingId": evidence["bindingId"],
              "resultSnapshotRef": evidence["resultSnapshotRef"], "queryDigest": evidence["queryDigest"],
              "queryDigestAfterRestart": repeated_query["queryDigest"],
              "status": 410, "code": "RESULT_EXPIRED", "result": "VOLATILE_SNAPSHOT_LOST_AND_QUERY_DIGEST_STABLE_AFTER_REAL_RESTART",
          }, indent=2), encoding="utf-8")
          print("M7 old cursor expired after real Spring Boot restart; identical local-query-v1 digest remained stable across JVM processes")
          PY
      - name: Prove M8 signed cursor fails 410 after actual JVM restart
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          evidence = json.loads(Path(os.environ["E2E_M8_CURSOR_EVIDENCE"]).read_text(encoding="utf-8"))
          fixture = json.loads(Path(os.environ["E2E_AUTH_FILE"]).read_text(encoding="utf-8"))
          deadline = datetime.fromisoformat(evidence["expiresAt"].replace("Z", "+00:00")).timestamp()
          assert deadline > time.time(), "M8 cursor naturally expired: restart loss not proven"
          request = Request(
              "http://127.0.0.1:8080/api/runtime/object-sets/traverse/pages",
              data=json.dumps({"cursor": evidence["cursor"]}).encode("utf-8"),
              method="POST",
              headers={"Authorization": "Bearer " + fixture["editorToken"],
                       "Content-Type": "application/json"},
          )
          try:
              with urlopen(request, timeout=15) as response:
                  raise AssertionError("M8 frozen LinkFacts unexpectedly survived service restart")
          except HTTPError as error:
              data = json.loads(error.read())
              assert error.code == 410, f"M8 stale cursor HTTP={error.code}: {data}"
              assert data.get("code") == "RESULT_EXPIRED", data
              assert "objects" not in data and "links" not in data, "Stale M8 cursor leaked LinkFacts"
          Path("/tmp/ontoforge-m8-cursor-restart-result.json").write_text(
              json.dumps({"packageId": evidence["packageId"],
                          "resultSnapshotRef": evidence["resultSnapshotRef"],
                          "code": "RESULT_EXPIRED", "http": 410,
                          "reason": "VOLATILE_FROZEN_RESULT_LOST_ON_REAL_RESTART"}, indent=2),
              encoding="utf-8")
          print("M8 v2 signed cursor returns 410 after actual backend JVM restart")
          PY
      - name: Prove M8 UPDATE UNKNOWN response recovers after actual JVM restart
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          evidence = json.loads(Path(os.environ["E2E_M8_LINK_RECEIPT_EVIDENCE"]).read_text(encoding="utf-8"))
          fixture = json.loads(Path(os.environ["E2E_AUTH_FILE"]).read_text(encoding="utf-8"))
          url = "http://127.0.0.1:8080/api/runtime/link-bindings/" + evidence["id"]
          headers = {"Authorization": "Bearer " + fixture["editorToken"],
                     "Content-Type": "application/json"}
          request = Request(url, method="PUT",
                            data=json.dumps(evidence["request"]).encode("utf-8"), headers=headers)
          with urlopen(request, timeout=20) as response:
              replayed = json.load(response)
              assert response.status == 200, response.status
          assert replayed["revision"] == evidence["revision"] == 2, replayed
          assert replayed["digest"] == evidence["digest"], replayed
          assert replayed["linkBindingId"] == evidence["id"], replayed

          detail_request = Request(
              url + "?packageId=" + evidence["packageId"], headers=headers)
          with urlopen(detail_request, timeout=15) as response:
              current = json.load(response)
          assert current["revision"] == evidence["revision"], current
          assert current["digest"] == evidence["digest"], current

          invalid = dict(evidence["request"])
          invalid["fkSourceColumn"] = "status"
          conflict = Request(url, method="PUT",
                             data=json.dumps(invalid).encode("utf-8"), headers=headers)
          try:
              with urlopen(conflict, timeout=15):
                  raise AssertionError("M8 same UUID accepted a different UPDATE body after JVM restart")
          except HTTPError as error:
              denied = json.loads(error.read())
              assert error.code == 409, (error.code, denied)
              assert denied.get("code") == "IDEMPOTENCY_KEY_CONFLICT", denied

          Path("/tmp/ontoforge-m8-write-restart-result.json").write_text(
              json.dumps({"linkBindingId": evidence["id"], "revision": current["revision"],
                          "digest": current["digest"], "result": "DURABLE_EXACTLY_ONCE_UPDATE_REPLAY_AFTER_JVM_RESTART",
                          "sameKeyDifferentBody": "HTTP_409"}, indent=2), encoding="utf-8")
          print("M8 UPDATE same operation UUID replayed revision 2, no revision 3, after real JVM restart")
          PY
      - name: Recheck M5 binding revisions and digests after real backend restart
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          evidence = json.loads(Path(os.environ["E2E_M5_BINDING_EVIDENCE"]).read_text(encoding="utf-8"))
          fixture = json.loads(Path(os.environ["E2E_AUTH_FILE"]).read_text(encoding="utf-8"))
          for revision_number in (1, 2):
              url = f"http://127.0.0.1:8080/api/runtime/bindings/{evidence['bindingId']}?revision={revision_number}"
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + fixture["editorToken"]})
              with urllib.request.urlopen(request, timeout=15) as response:
                  detail = json.load(response)
              assert detail["bindingId"] == evidence["bindingId"]
              assert detail["revision"] == evidence[f"revision{revision_number}"]
              assert detail["snapshotId"] == evidence["snapshotId"]
              assert detail["digest"] == evidence[f"digest{revision_number}"]
              assert detail["identityDomainId"] == evidence[f"identityDomainId{revision_number}"]
          print("M5 revisions 1 and 2 persisted across backend restart; digests and identity domains match")
          PY
      - name: Recheck original ObjectType, Snapshot and LinkType bytes after real backend restart
        shell: pwsh
        run: |
          $fixture = Get-Content -LiteralPath $env:E2E_AUTH_FILE -Raw | ConvertFrom-Json
          $env:ONTOFORGE_BEARER_TOKEN = $fixture.editorToken
          ./scripts/verify-objecttype.ps1 -Mode Recheck -EvidencePath '${{ runner.temp }}/ontoforge-objecttype-acceptance.json'
          ./scripts/verify-snapshot.ps1 -Mode Recheck -EvidencePath '${{ runner.temp }}/ontoforge-snapshot-acceptance.json'
          ./scripts/verify-linktype.ps1 -Mode Recheck -EvidencePath '${{ runner.temp }}/ontoforge-linktype-acceptance.json'
      - name: Keep real service logs and screenshots for review
        if: always()
        run: |
          mkdir -p /tmp/ontoforge-e2e-evidence
          cp /tmp/ontoforge-api.log /tmp/ontoforge-e2e-evidence/backend.log 2>/dev/null || true
          cp /tmp/ontoforge-vite.log /tmp/ontoforge-e2e-evidence/vite.log 2>/dev/null || true
          cp '${{ runner.temp }}/ontoforge-objecttype-acceptance.json' /tmp/ontoforge-e2e-evidence/windows-acceptance-script-on-linux.json 2>/dev/null || true
          cp '${{ runner.temp }}/ontoforge-snapshot-acceptance.json' /tmp/ontoforge-e2e-evidence/snapshot-exercise-recheck-on-linux.json 2>/dev/null || true
          cp '${{ runner.temp }}/ontoforge-linktype-acceptance.json' /tmp/ontoforge-e2e-evidence/linktype-exercise-recheck-on-linux.json 2>/dev/null || true
          cp /tmp/ontoforge-api-restarted.log /tmp/ontoforge-e2e-evidence/backend-after-restart.log 2>/dev/null || true
          cp /tmp/ontoforge-m5-binding-acceptance.json /tmp/ontoforge-e2e-evidence/m5-binding-acceptance.json 2>/dev/null || true
          cp /tmp/ontoforge-m7-b0-revocation.json /tmp/ontoforge-e2e-evidence/m7-b0-revocation.json 2>/dev/null || true
          cp /tmp/ontoforge-m7-cursor-restart-result.json /tmp/ontoforge-e2e-evidence/m7-cursor-restart-result.json 2>/dev/null || true
          cp /tmp/ontoforge-m8-cursor-restart-result.json /tmp/ontoforge-e2e-evidence/m8-cursor-restart-result.json 2>/dev/null || true
          cp /tmp/ontoforge-m8-write-restart-result.json /tmp/ontoforge-e2e-evidence/m8-write-restart-result.json 2>/dev/null || true
          cp /tmp/ontoforge-idp.log /tmp/ontoforge-e2e-evidence/test-idp.log 2>/dev/null || true
          cp -r '${{ runner.temp }}/ontoforge-native-e2e-shots' /tmp/ontoforge-e2e-evidence/screenshots 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ontoforge-native-real-e2e
          path: /tmp/ontoforge-e2e-evidence/
          if-no-files-found: warn
          retention-days: 14
  session-stories:
    name: Real Local Session User Stories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ontoforge_test_session_e2e
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: ontology_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontology -d ontoforge_test_session_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/ontoforge_test_session_e2e
      DB_USERNAME: ontology
      DB_PASSWORD: ontology_dev_only
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ontoforge_test_session_e2e
      TEST_DB_USERNAME: ontology
      TEST_DB_PASSWORD: ontology_dev_only
      SESSION_E2E_AUTH_FILE: /tmp/ontoforge-session-private.json
      ONTOFORGE_BOOTSTRAP_ADMIN_ENABLED: 'true'
      ONTOFORGE_OBJECTSET_CURSOR_SIGNING_SECRET: ontoforge-e2e-local-session-cursor-secret-2026
      S0_HOST: 127.0.0.1
      E2E_SHOTS: /tmp/ontoforge-session-screens
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ontoforge-ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and prepare private test credentials
        run: |
          mvn -B -pl ontoforge-boot -am -DskipTests install
          mvn -B -pl ontoforge-boot dependency:build-classpath -Dmdep.outputFile=target/e2e-classpath
          java -cp "ontoforge-boot/target/test-classes:$(cat ontoforge-boot/target/e2e-classpath)" io.ontoforge.boot.LocalSessionBrowserFixture prepare "$SESSION_E2E_AUTH_FILE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          fixture = json.loads(Path(os.environ['SESSION_E2E_AUTH_FILE']).read_text())
          print('::add-mask::' + fixture['password'])
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('ONTOFORGE_BOOTSTRAP_ADMIN_USERNAME=' + fixture['username'] + '\n')
              stream.write('ONTOFORGE_BOOTSTRAP_ADMIN_PASSWORD=' + fixture['password'] + '\n')
          PY
      - name: Start default Session server and explicitly grant the test workspace
        run: |
          java -jar ontoforge-boot/target/ontoforge-boot-0.1.0-SNAPSHOT.jar >/tmp/ontoforge-session-api.log 2>&1 &
          echo $! >/tmp/ontoforge-session-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/system/status >/dev/null; then break; fi
            sleep 1
          done
          java -cp "ontoforge-boot/target/test-classes:$(cat ontoforge-boot/target/e2e-classpath)" io.ontoforge.boot.LocalSessionBrowserFixture provision "$SESSION_E2E_AUTH_FILE"
          cd ontoforge-ui
          npm ci
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/ontoforge-session-vite.log 2>&1 &
          echo $! >/tmp/ontoforge-session-vite.pid
      - name: Run real password, Cookie, CSRF, save, logout and recovery stories
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          python -m unittest discover -s ontoforge-ui/e2e -p session_stories.py -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ontoforge-local-session-real-e2e
          path: |
            /tmp/ontoforge-session-api.log
            /tmp/ontoforge-session-vite.log
            /tmp/ontoforge-session-screens/
          retention-days: 14
      - name: Stop this job's application processes
        if: always()
        run: |
          for file in /tmp/ontoforge-session-api.pid /tmp/ontoforge-session-vite.pid; do
            if test -f "$file"; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
