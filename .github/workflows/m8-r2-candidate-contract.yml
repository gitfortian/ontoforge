name: M8 R2 Candidate Contract Review

on:
  pull_request:
    paths:
      - 'doc/design/candidates/m8-r2/**'
      - 'doc/design/tests/test_m8_r2_candidate_contract.py'
      - '.github/workflows/m8-r2-candidate-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8-r2-structural-contracts:
    name: M8 R2 Candidate Schema Negative Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate M8 R2 draft schemas and negative fixtures
        run: python -m unittest discover -s doc/design/tests -p 'test_m8_r2_candidate_contract.py' -v
