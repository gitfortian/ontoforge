name: M8 R2 Candidate Contract Review

on:
  pull_request:
    paths:
      - 'doc/design/candidates/m8-r2/**'
      - 'doc/design/tests/test_m8_r2_candidate_contract.py'
      - 'doc/design/candidates/m8-2/**'
      - 'doc/design/tests/test_m8_2_bridge_candidate_contract.py'
      - 'doc/design/tests/test_m8_2_bridge_migration_candidate.py'
      - 'doc/design/tests/m8_2_bridge_candidate_pg17.sql'
      - '.github/workflows/m8-r2-candidate-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8-r2-structural-contracts:
    name: M8 R2 Candidate Schema Negative Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate M8.1 R2 draft schemas and negative fixtures
        run: python -m unittest discover -s doc/design/tests -p 'test_m8_r2_candidate_contract.py' -v
      - name: Validate M8.2 R2 bridge draft schemas, evidence roles and v1 regression
        run: python -m unittest discover -s doc/design/tests -p 'test_m8_2_bridge_candidate_contract.py' -v
      - name: Review forward-only V10 compatibility of proposed M8.2 Bridge migration (no PG execution)
        run: python -m unittest discover -s doc/design/tests -p 'test_m8_2_bridge_migration_candidate.py' -v

  m8-2-pg17-candidate-upgrade:
    name: M8.2 PG17 V10 Forward Candidate Compatibility (NON-PRODUCTION)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: m8review
          POSTGRES_PASSWORD: m8review
          POSTGRES_DB: m8review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m8review -d m8review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout candidate and actual V10
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute original V10 and Bridge proposal in isolated PG17
        env:
          PGPASSWORD: m8review
        run: >-
          psql -X -h 127.0.0.1 -p 5432 -U m8review -d m8review
          -v ON_ERROR_STOP=1 -f doc/design/tests/m8_2_bridge_candidate_pg17.sql
      - name: Scope notice
        if: always()
        run: |
          echo "Review-only: isolated PostgreSQL 17 V10 + Bridge DDL candidate."
          echo "No Flyway application upgrade, production writes, or runtime authorization."
