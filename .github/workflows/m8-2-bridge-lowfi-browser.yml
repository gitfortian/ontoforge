name: M8.2 BridgeTable UX-Low Chromium Review

# Synthetic interactive prototype; no claims of production PG/JWT/React coverage.
on:
  pull_request:
    paths:
      - 'doc/prototypes/m8-2-bridge-table-lowfi.html'
      - 'doc/prototypes/tests/test_m8_2_bridge_table_lowfi_browser.py'
      - 'doc/implementation/M8-2-BridgeTable-UX-Low评审说明.md'
      - '.github/workflows/m8-2-bridge-lowfi-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8-2-ux-low-chromium:
    name: M8.2 UX-Low Real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.57.0
      - name: Install Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Exercise BridgeTable UX-Low state and negative journeys
        env:
          UX_CAPTURE_SCREENSHOTS: '1'
          UX_SCREENSHOT_DIR: '${{ runner.temp }}/m8-2-bridge-lowfi-shots'
        run: python -m unittest doc.prototypes.tests.test_m8_2_bridge_table_lowfi_browser -v
      - name: Save actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m8-2-bridge-lowfi-chromium
          path: '${{ runner.temp }}/m8-2-bridge-lowfi-shots'
          if-no-files-found: warn
          retention-days: 14
