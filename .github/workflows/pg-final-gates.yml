name: Ontology Final Architecture POC Gates

on:
  push:
    branches:
      - research/poc-final-architecture-gates-20261015
  pull_request:
    paths:
      - "experiments/pg-runtime/**"
      - ".github/workflows/pg-final-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-pg-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-final-gates:
    name: PostgreSQL 17 - lots=${{ matrix.lots }} fanout=${{ matrix.fanout }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lots: 100000
            fanout: 8
          - lots: 250000
            fanout: 24
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ontopoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ontopoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POC_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ontopoc
      POC_LOTS: ${{ matrix.lots }}
      POC_FANOUT: ${{ matrix.fanout }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Base PostgreSQL query/outbox smoke regression
        run: python experiments/pg-runtime/run_pg_poc.py
      - name: High fanout, auth and Action race gates
        run: python experiments/pg-runtime/run_final_gates.py
      - name: Store raw EXPLAIN and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ontology-pg-final-lots-${{ matrix.lots }}-fanout-${{ matrix.fanout }}
          path: experiments/pg-runtime/artifacts/
          if-no-files-found: warn
