name: M8.1 LinkBinding UX-High Chromium Review

# Design-only browser verification: synthetic data, no PG/JWT/API or production approval.
on:
  pull_request:
    paths:
      - 'doc/prototypes/m8-1-linkbinding-highfi.html'
      - 'doc/prototypes/tests/test_m8_1_linkbinding_highfi_browser.py'
      - 'doc/implementation/M8-1-LinkBinding-UX-High评审说明.md'
      - '.github/workflows/m8-1-linkbinding-highfi-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8-1-ux-high-chromium:
    name: M8.1 UX-High Real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.57.0
      - name: Install actual Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify high-fidelity interactions, failures, modal and async races
        env:
          UX_CAPTURE_SCREENSHOTS: '1'
          UX_SCREENSHOT_DIR: '${{ runner.temp }}/m8-1-linkbinding-highfi-shots'
        run: python -m unittest doc.prototypes.tests.test_m8_1_linkbinding_highfi_browser -v
      - name: Upload high-fidelity screenshots for product review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m8-1-linkbinding-highfi-chromium
          path: '${{ runner.temp }}/m8-1-linkbinding-highfi-shots'
          if-no-files-found: warn
          retention-days: 14
