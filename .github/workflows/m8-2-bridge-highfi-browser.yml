name: M8.2 BridgeTable UX-High Chromium Review

# High-fidelity local interaction prototype only. No production BridgeTable PG/JWT or React.
on:
  pull_request:
    paths:
      - 'doc/prototypes/m8-2-bridge-table-highfi.html'
      - 'doc/prototypes/tests/test_m8_2_bridge_table_highfi_browser.py'
      - 'doc/implementation/M8-2-BridgeTable-UX-High评审与签收矩阵.md'
      - '.github/workflows/m8-2-bridge-highfi-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8-2-ux-high-chromium:
    name: M8.2 UX-High Real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.57.0
      - name: Install actual Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate M8.2 UX-High, 58 end-to-end prototype scenarios
        env:
          UX_CAPTURE_SCREENSHOTS: '1'
          UX_SCREENSHOT_DIR: '${{ runner.temp }}/m8-2-bridge-highfi-shots'
        run: python -m unittest doc.prototypes.tests.test_m8_2_bridge_table_highfi_browser -v
      - name: Retain real browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m8-2-bridge-highfi-chromium
          path: '${{ runner.temp }}/m8-2-bridge-highfi-shots'
          if-no-files-found: warn
          retention-days: 14
