name: Ontology Architecture V1.3 Docs Gates

on:
  push:
    branches:
      - docs/ontology-architecture-v1.3-baseline-20261015
  pull_request:
    paths:
      - "README.md"
      - "doc/**"
      - "experiments/pg-runtime/README.md"
      - ".github/workflows/architecture-docs-v13.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-and-native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Verify one current architecture, no stale links, preserved history fixtures
        run: python -m unittest discover -s doc/tests -p test_architecture_docs.py -v
      - name: Regression test existing Native DSL AST V0.2 schemas and examples
        run: python -m unittest discover -s doc/design/tests -p test_native_v02.py -v
