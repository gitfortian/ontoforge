version: 2
updates:
  - package-ecosystem: npm
    directory: /ontoforge-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-runtime-and-types:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
