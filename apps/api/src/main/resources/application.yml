server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${S0_COOKIE_SECURE:false}
spring:
  application:
    name: ontology-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ontology}
    username: ${DB_USERNAME:ontology}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
s0:
  bootstrap:
    enabled: ${S0_BOOTSTRAP_ENABLED:false}
    username: ${S0_BOOTSTRAP_USERNAME:admin}
    password: ${S0_BOOTSTRAP_PASSWORD:}
